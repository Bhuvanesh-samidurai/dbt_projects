name: 'energy_grid_project'
version: '1.0.0'
config-version: 2

# Profile lives in ./profiles.yml (targets: `local` = DuckDB, `snowflake` = production)
profile: 'energy_grid_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Medallion layout: BRONZE (raw, loaded by Databricks) -> SILVER (staging views) -> GOLD (marts)
# Schema names are used exactly as written thanks to macros/generate_schema_name.sql
models:
  energy_grid_project:
    staging:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table

# Sample Bronze data for the local DuckDB run only.
# Disabled on Snowflake so `dbt build` can never overwrite the real BRONZE tables.
seeds:
  energy_grid_project:
    sample_bronze:
      +schema: bronze
      +enabled: "{{ target.type != 'snowflake' }}"
      fact_energy_readings:
        +column_types:
          LCLID: varchar
          TSTP: timestamp
          ENERGY_KWH_PER_HR: double
      agg_daily_consumption:
        +column_types:
          LCLID: varchar
          DATE: date
          TOTAL_KWH_DAY: double
          AVG_KWH_PER_SLOT: double
          PEAK_KWH: double
      dim_households:
        +column_types:
          LCLID: varchar
          STDORTOU: varchar
          ACORN: varchar
          ACORN_GROUPED: varchar
